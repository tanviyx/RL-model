<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register · SmartSignal</title><link rel="stylesheet" href="/css/auth.css"></head>
<body><aside class="side"><div class="light" aria-hidden="true"><span class="lamp" data-c="red"></span><span class="lamp" data-c="amber"></span><span class="lamp" data-c="green"></span></div><div><h2>Signals that learn the traffic.</h2><p>Log in to run the adaptive signal simulation.</p></div></aside>
<main><div class="panel">
<h1>Create your account</h1><p class="lead">Takes under a minute.</p>
<a class="google" href="/api/auth/google"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg> Continue with Google</a>
<div class="or">or register with email</div>
<form data-endpoint="/api/auth/register">
<label>Name<input type="text" name="name" autocomplete="name" minlength="2" maxlength="60" required></label>
<label>Email<input type="email" name="email" autocomplete="email" required></label>
<label>Password<input type="password" name="password" autocomplete="new-password" minlength="8" maxlength="72" required>
<span class="hint">At least 8 characters, with a letter and a number.</span></label>
<button class="submit" type="submit">Create account</button>
<p id="msg" role="alert" aria-live="polite"></p>
</form>
<p class="switch">Already registered? <a href="/login">Log in</a></p>
<p class="switch"><a href="/">Back to home</a></p>
</div></main>
<script src="/js/auth.js"></script></body></html>

services:
  mongo:
    image: mongo
    container_name: traffic_mongo
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ./server
      target: runtime
    container_name: traffic_backend
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - MONGO_URI=mongodb://mongo:27017/Capstone
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - BASE_URL=http://localhost:5000
      # Load level of the real-demand simulation (see tools/evaluate.mjs for how it was chosen)
      - DEMAND_SCALE=${DEMAND_SCALE:-3}
      - DEMAND_START_HOUR=${DEMAND_START_HOUR:-}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('https').get('https://localhost:5000/api/health',{rejectUnauthorized:false},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build:
      context: ./client
      target: runtime
    container_name: traffic_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      # Same Google client ID, exposed to Vite so login.jsx can read it
      - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}

volumes:
  mongo_data:





